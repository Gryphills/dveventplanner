<head>
  <script src="brains.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body style="background-color:rgb(249, 240, 225);">
<div style="display: flex; background-color: rgb(249, 240, 225); padding: 5px; min-height: 100vh;">
  <div style="background-color: rgb(249, 240, 225); padding: 5px; min-height: 100vh; width: 75%;">
    <details class="details wantdet" open>
      <summary style="font-weight: bold; font-size: 2em; margin: auto;">Want</summary>
      <div id="wantdiv" style="justify-content: center; text-align: center; display: flex; flex-wrap: wrap;">
      </div>
    </details>
    <details class="details neutraldet" open>
      <summary style="font-weight: bold; font-size: 2em; margin: auto;">Unacquired</summary>
      <div id="neutraldiv" style="justify-content: center; text-align: center; display: flex; flex-wrap: wrap;">
      </div>
    </details>
    <details class="details havedet">
      <summary style="font-weight: bold; font-size: 2em; margin: auto;">Have</summary>
      <div id="havediv" style="justify-content: center; text-align: center; display: flex; flex-wrap: wrap;">
      </div>
    </details>
    <details class="details ignoredet">
      <summary style="font-weight: bold; font-size: 2em; margin: auto;">Meh/Ignore</summary>
      <div id="ignorediv" style="justify-content: center; text-align: center; display: flex; flex-wrap: wrap;">
      </div>
    </details>
  </div>
  <div style="width: 25%; text-align: left; margin: 10px;">
    <div style="text-align:center;">
      <button  style="margin:auto; display:inline; padding:10px; margin:10px;" class="buttons pressed" data-toggled="1" onclick="toggleVis(this, 'dragon')">Toggle Dragon Visibility</button><br>
      <button id='decobutton' style="margin:auto; display:inline; padding:10px; margin:10px;" class="buttons" data-toggled="1" onclick="toggleVis(this, 'deco')">Toggle Deco Visibility</button>
    </div>
    <br/>
    <div style="background-color: rgb(173, 164, 211); border: 4px solid rgb(37, 7, 87); border-radius: 0.5rem; padding: 10px; margin: 10px;">
      <div id="itemstobuy">
      </div>
      <p style="font-weight: bold; font-size: large;" id="calctotals">0</p>
    </div>
  </div>
</div>
</body>
